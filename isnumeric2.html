<!DOCTYPE html>
<head>
    <title>Is Numeric Value</title>
    <script>
        function btnFind_onclick() {
            
            var n = 0.0;

            n = tbxn.value;
            n = parseFloat(n);
                       
            if(isNaN(n)) {
                rdobtninvalid.checked = true;
            } else {
                rdobtnvalid.checked = true;
            }
        }
    </script>
</head>
<table border="1">
    <tr>
        <td>Enter numeric value</td>
        <td><input type="text" id="tbxn" placeholder="0.0" step="any"></td>
    </tr>
    <tr>
        <td>Is Valid</td>
        <td><input type="radio" name="result" id="rdobtnvalid" disabled="disabled"> Valid
            <input type="radio" name="result" id="rdobtninvalid" disabled="disabled"> Invalid</td>
    </tr>
    <tr>
        <td><input type="button" value="Cancel" onclick="location.href='isnumeric2.html';"></td>
        <td><input type="button" value="Find" onclick="btnFind_onclick();"></td>
    </tr>
</table>
