<!DOCTYPE html>
<head>
    <title>Sign1</title>
    <script>
        function btnFind_onclick(){
            var n=0.0;

            n=numn.value;
            n=parseFloat(n);
            n=isNaN(n) ? 0 : n;

            if(n<0){
                sign = 'Negative';
            } else if(n>0) {
                sign = 'Positive';
            } else{
                sign = 'Neutral';
            }

            tbxsign.value = sign;
        }
    </script>
</head>
<table border="1">
    <tr>
        <td>Enter number</td>
        <td><input type="text" id="numn" placeholder="0.0" step="any"></td>
    </tr>
    <tr>
        <td>Signature</td>
        <td><input type="text" id="tbxsign" placeholder="Positive/Negative/Neutral" readonly="readonly"></td>
    </tr>
    <tr>
        <td><input type="button" value="Cancel" onclick="location.href='sign1.html';"></td>
        <td><input type="button" value="Find" onclick="btnFind_onclick();"></td>
    </tr>
</table>
