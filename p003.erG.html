<!DOCTYPE html>
<head>
    <title>
        Exam Results with Grade
    </title>
</head>
    <script>
        function btnFind_onclick(){
            //below initialize variables
            var m1=0, m2=0, total=0, avg=0, result='Fail';

            m1=numm1.value;
            m1=parseFloat(m1);
            m1=isNaN(m1) ? 0 : m1;

            m2=numm2.value;
            m2=parseFloat(m2);
            m2=isNaN(m2) ? 0 : m2;
            
            total=m1 + m2;
            avg=total/2;
            result=(m1>34.4 && m2>34.4) ? "Pass" : "Fail";

            let grade;
            if(avg<=100 && avg>=98){
                grade='O';
            }
            else if(avg<=97 && avg>=90){
                grade='A+';
            }
            else if(avg<=89 && avg>=85){
                grade='A';
            }
            else if(avg<=84 && avg>=80){
                grade='B';
            }
            else{
                grade="nograde";
            }
    
            numtotal.value=total;
            numavg.value=avg;
            tbxres.value=result;
            tbxgrade.value=grade;
        }
    </script>
<table border="1">
    <tr>
        <td>Roll no:</td>
        <td><input type="number" id="numrno" placeholder="0"></td> 
    </tr>
    <tr>
        <td>Student name:</td>
        <td><input type="text" id="tbxsname" placeholder="Unknown"></td> 
    </tr>
    <tr>
        <td>Mark 1</td>
        <td><input type="number" id="numm1" placeholder="0.0" step="any"></td> 
    </tr>
    <tr>
        <td>Mark 2</td>
        <td><input type="number" id="numm2" placeholder="0.0" step="any"></td> 
    </tr>
    <tr>
        <td>Total</td>
        <td><input type="number" id="numtotal" placeholder="0.0" step="any" readonly="readonly"></td> 
    </tr>
    <tr>
        <td>Average</td>
        <td><input type="number" id="numavg" placeholder="0.0" step="any" readonly="readonly"></td> 
    </tr>
    <tr>
        <td>Result</td>
        <td><input type="text" id="tbxres" placeholder="fail" readonly="readonly"></td> 
    </tr>
    <tr>
        <td>Grade</td>
        <td><input type="text" id="tbxgrade" placeholder="nograde" readonly="readonly"></td> 
    </tr>
    <tr>
        <td><input type="button" value="Cancel" 
            onclick="location.href='p003.erG.html';""></td> 
        <td><input type="button" value="Find"
            onclick="btnFind_onclick();"></td>
    </tr>
</table>
