<!DOCTYPE html>
<head>
    <title>Is Numeric Value</title>
    <script>
        function btnFind_onclick() {
            
            var n = 0.0;

            n = tbxn.value;
            n = parseFloat(n);
                       
            if(isNaN(n)) {
                result = "Invalid";
            } else {
                result = "Valid";
            }
            tbxresult.value = result;
        }
    </script>
</head>
<table border="1">
    <tr>
        <td>Enter numeric value</td>
        <td><input type="text" id="tbxn" placeholder="0.0" step="any"></td>
    </tr>
    <tr>
        <td>Is Valid</td>
        <td><input type="text" id="tbxresult" readonly="readonly"></td>
    </tr>
    <tr>
        <td><input type="button" value="Cancel" onclick="location.href='isnumeric3.html';"></td>
        <td><input type="button" value="Find" onclick="btnFind_onclick();"></td>
    </tr>
</table>
