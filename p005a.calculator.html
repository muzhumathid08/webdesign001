<!DOCTYPE html>
<head>
    <title>Calculator</title>
</head>
<script>
    function btnCalcu(aop){

        var fn=0.0, sn=0.0,res=0.0;

        fn=numfn.value;
        fn=parseFloat(fn);
        fn=isNaN(fn) ? 0 :fn;

        sn=numsn.value;
        sn=parseFloat(sn);
        sn=isNaN(sn) ? 0 :sn;

        if(aop.equals('+')) {
            res = fn + sn;
        }
        else if(aop.equals('-')) {
            res = fn - sn;
        }
        else if(aop.equals('*')) {
            res = fn * sn;
        }
        else if(aop.equals('/')) {
            res = fn / sn;
        }
        else if(aop.equals('%')) {
            res = fn % sn;
        }
        else if(aop.equals('^')) {
            res = fn ** sn;
        }
        else{
            res=0;
        }

        numres.value=res;

    }
</script>
<table border="1">
    <tr>
        <td>First Number</td>
        <td><input type="number" id="numfn" placeholder="0.0" step="any"></td>
    </tr>
    <tr>
        <td>Second Number</td>
        <td><input type="number" id="numsn" placeholder="0.0" step="any"></td>
    </tr>
    <tr>
        <td>Result</td>
        <td><input type="number" id="numres" placeholder="0.0" step="any" readonly="readonly"></td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Cancel" onclick="location.href='p005a.calculator.html';">
            <input type="button" value="+" onclick="btnCalcu('aop');">
            <input type="button" value="-" onclick="btnCalcu('aop');">
            <input type="button" value="*" onclick="btnCalcu('aop');">
        </td>
        <td>
            <input type="button" value="/" onclick="btnCalcu('aop');">
            <input type="button" value="%" onclick="btnCalcu('aop');">
            <input type="button" value="^" onclick="btnCalcu('aop');">
        </td>
    </tr>
</table>
