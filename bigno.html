<!DOCTYPE html>
<head>
    <title>Big number</title>
    <script>
        function uToFloat(s) {
            var n = parseFloat(s);

            n = isNaN(n) ? 0 : n;
            return n;
        }

        function btnFind_onclick() {
            
            var fn = uToFloat(tbxfn.value);
            var sn = uToFloat(tbxsn.value);
            var tn = uToFloat(tbxtn.value);

            if(fn > sn && fn > tn) {
                bn = fn ;
            } else  if(sn > fn && sn > tn) {
                bn = sn ;
            } else  if(tn > fn && tn > sn) {
                bn = tn ;
            }

        tbxbn.value = bn;

        }
    </script>
</head>
<table border="1">
    <tr>
        <td>First Number</td>
        <td><input type="text" id="tbxfn" placeholder="0.0" step="any"></td>
    </tr>
     <tr>
        <td>Second Number</td>
        <td><input type="text" id="tbxsn" placeholder="0.0" step="any"></td>
    </tr>
     <tr>
        <td>Third Number</td>
        <td><input type="text" id="tbxtn" placeholder="0.0" step="any"></td>
    </tr>
     <tr>
        <td>Big Number</td>
        <td><input type="text" id="tbxbn" placeholder="0.0" step="any" readonly="readonly"></td>
    </tr>
    <tr>
        <td><input type="button" value="Cancel" onclick="location.href='bigno.text.html';"></td>
        <td><input type="button" value="Find" onclick="btnFind_onclick();"></td>
    </tr>
</table>
